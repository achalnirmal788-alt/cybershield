<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShield - Phishing & Online Fraud Awareness</title>
    <meta name="description" content="Interactive cybersecurity awareness platform to detect phishing, identify online frauds, practice with realistic scam simulations, and test your defense readiness." />
    <meta property="og:title" content="CyberShield - Phishing & Online Fraud Awareness" />
    <meta property="og:description" content="Interactive cybersecurity awareness platform to detect phishing, identify online frauds, practice with realistic scam simulations, and test your defense readiness." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 min-h-screen">
    <div id="root">
      <!-- Loading screen while React bundle initializes -->
      <div id="initial-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; padding: 1.5rem;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 1.25rem;">
          <div style="position: absolute; inset: 0; border: 3px solid rgba(6, 182, 212, 0.15); border-radius: 50%;"></div>
          <div style="position: absolute; inset: 0; border: 3px solid transparent; border-top-color: #06b6d4; border-radius: 50%; animation: cybershield-spin 0.9s linear infinite;"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
          <span style="font-weight: 800; font-size: 1.35rem; letter-spacing: -0.02em; color: #f8fafc;">CYBER<span style="color: #06b6d4;">SHIELD</span></span>
          <span style="font-size: 0.65rem; background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); padding: 0.15rem 0.45rem; border-radius: 0.25rem; font-weight: 700; text-transform: uppercase;">PRO</span>
        </div>
        <p style="color: #64748b; font-size: 0.85rem; max-width: 320px; line-height: 1.4;">Initializing defense modules & fraud simulator...</p>
      </div>
      <style>
        @keyframes cybershield-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
